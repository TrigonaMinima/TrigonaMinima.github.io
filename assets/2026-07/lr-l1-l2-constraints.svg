<svg xmlns="http://www.w3.org/2000/svg" width="670" height="300" viewBox="0 0 670 300" role="img" aria-label="Two panels comparing L1 and L2 constraint regions against elliptical loss contours, animated shrinking inward to their first point of contact. The L1 diamond is first touched at a corner where one weight is zero. The L2 circle is first touched at a smooth point where neither weight is zero">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="160" y="45" text-anchor="middle" fill="#111111" font-size="15" font-weight="600" font-family="Monaco, Consolas, 'Lucida Console', monospace">L1 (lasso)</text>
  <line x1="90" y1="170" x2="250" y2="170" stroke="#e8e8e8" stroke-width="1.5"/>
  <line x1="160" y1="100" x2="160" y2="240" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="254" y="174" fill="#777777" font-size="11" font-family="Monaco, Consolas, 'Lucida Console', monospace">w1</text>
  <text x="164" y="96" fill="#777777" font-size="11" font-family="Monaco, Consolas, 'Lucida Console', monospace">w2</text>
  <path d="M160,110 L220,170 L160,230 L100,170 Z" fill="rgba(192,57,43,0.1)" stroke="#c0392b" stroke-width="2"/>
  <g transform="translate(246,144)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1.45;1.45;1;1" keyTimes="0;0.15;0.7;1" dur="3s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0.45;0.45;0.85;0.85" keyTimes="0;0.15;0.7;1" dur="3s" repeatCount="indefinite" calcMode="linear"/>
      <ellipse cx="0" cy="0" rx="40" ry="24" transform="rotate(-25)" fill="none" stroke="#1f7a4d" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="55" ry="33" transform="rotate(-25)" fill="none" stroke="#1f7a4d" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="70" ry="42" transform="rotate(-25)" fill="none" stroke="#1f7a4d" stroke-width="1.5"/>
    </g>
  </g>
  <circle cx="220" cy="170" r="4" fill="#111111">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.8;1" dur="3s" repeatCount="indefinite" calcMode="linear"/>
  </circle>
  <text x="222" y="188" fill="#111111" font-size="12" font-family="Monaco, Consolas, 'Lucida Console', monospace">touches corner</text>
  <text x="222" y="202" fill="#111111" font-size="12" font-family="Monaco, Consolas, 'Lucida Console', monospace">w2 = 0</text>

  <text x="480" y="45" text-anchor="middle" fill="#111111" font-size="15" font-weight="600" font-family="Monaco, Consolas, 'Lucida Console', monospace">L2 (ridge)</text>
  <line x1="410" y1="170" x2="570" y2="170" stroke="#e8e8e8" stroke-width="1.5"/>
  <line x1="480" y1="100" x2="480" y2="240" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="574" y="174" fill="#777777" font-size="11" font-family="Monaco, Consolas, 'Lucida Console', monospace">w1</text>
  <text x="484" y="96" fill="#777777" font-size="11" font-family="Monaco, Consolas, 'Lucida Console', monospace">w2</text>
  <circle cx="480" cy="170" r="60" fill="rgba(42,122,226,0.1)" stroke="#2a7ae2" stroke-width="2"/>
  <g transform="translate(565,118)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1.45;1.45;1;1" keyTimes="0;0.15;0.7;1" dur="3s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0.45;0.45;0.85;0.85" keyTimes="0;0.15;0.7;1" dur="3s" repeatCount="indefinite" calcMode="linear"/>
      <ellipse cx="0" cy="0" rx="40" ry="24" transform="rotate(-25)" fill="none" stroke="#1f7a4d" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="55" ry="33" transform="rotate(-25)" fill="none" stroke="#1f7a4d" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="70" ry="42" transform="rotate(-25)" fill="none" stroke="#1f7a4d" stroke-width="1.5"/>
    </g>
  </g>
  <circle cx="531" cy="139" r="4" fill="#111111">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.8;1" dur="3s" repeatCount="indefinite" calcMode="linear"/>
  </circle>
  <text x="480" y="255" text-anchor="middle" fill="#111111" font-size="12" font-family="Monaco, Consolas, 'Lucida Console', monospace">touches a smooth point</text>
  <text x="480" y="269" text-anchor="middle" fill="#111111" font-size="12" font-family="Monaco, Consolas, 'Lucida Console', monospace">neither weight is zero</text>
</svg>
